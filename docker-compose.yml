services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dollar
      POSTGRES_PASSWORD: dollar
      POSTGRES_DB: dollar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dollar -d dollar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: dollar
      DB_PASSWORD: dollar
      DB_NAME: dollar_db
    ports:
      - "3001:3001"

volumes:
  pgdata:
